[workspace]
resolver = "2"
members = [
    "crates/driftwood-core",
    "crates/driftwood-cli",
    "crates/driftwood-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "signal"] }
walkdir = "2"
toml = "0.9"
plist = "1"

driftwood-core = { path = "crates/driftwood-core" }
