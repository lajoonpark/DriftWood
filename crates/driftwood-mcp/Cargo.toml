[package]
name = "driftwood-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DriftWood MCP server: thin rmcp wrapper over driftwood-core."

[[bin]]
name = "driftwood-mcp"
path = "src/main.rs"

[dependencies]
driftwood-core.workspace = true
rmcp = { version = "3.4", features = ["server", "schemars", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
