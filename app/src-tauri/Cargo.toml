[package]
name = "driftwood-app"
version = "1.4.0"
description = "DriftWood — AI-assisted scan of unused files, folders, and apps (read-only reporting)"
edition = "2021"

[lib]
name = "driftwood_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
driftwood-core = { workspace = true }

[dev-dependencies]
tempfile = "3"
